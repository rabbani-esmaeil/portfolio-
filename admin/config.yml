backend:
  name: github
  repo: rabbani-esmaeil/portfolio-
  branch: main

media_folder: "/"
public_folder: "/"

collections:
  - name: "portfolio_content"
    label: "مدیریت محتوای پورتفولیو"
    files:
      - name: "content_fa"
        label: "ویرایش نسخه فارسی (FA)"
        file: "content.json"
        format: "json"
        fields:
          - label: "بخش معرفی (Hero)"
            name: "fa"
            widget: "object"
            fields:
              - { label: "نام", name: "header_name", widget: "string" }
              - { label: "عنوان و سمت فعلی", name: "status", widget: "string" }
              - { label: "تیتر شغلی", name: "hero_role", widget: "string" }
              - { label: "خلاصه درباره من", name: "hero_desc", widget: "text" }

              - { label: "عنوان سابقه ۱", name: "exp1_title", widget: "string" }
              - { label: "سازمان سابقه ۱", name: "exp1_org", widget: "string" }
              - { label: "تاریخ سابقه ۱", name: "exp1_date", widget: "string" }
              - { label: "مورد ۱ سابقه ۱", name: "exp1_b1", widget: "string" }
              - { label: "مورد ۲ سابقه ۱", name: "exp1_b2", widget: "string" }
              - { label: "مورد ۳ سابقه ۱", name: "exp1_b3", widget: "string" }
              - { label: "مورد ۴ سابقه ۱", name: "exp1_b4", widget: "string" }

              - { label: "عنوان سابقه ۲", name: "exp2_title", widget: "string" }
              - { label: "سازمان سابقه ۲", name: "exp2_org", widget: "string" }
              - { label: "تاریخ سابقه ۲", name: "exp2_date", widget: "string" }
              - { label: "مورد ۱ سابقه ۲", name: "exp2_b1", widget: "string" }
              - { label: "مورد ۲ سابقه ۲", name: "exp2_b2", widget: "string" }
              - { label: "مورد ۳ سابقه ۲", name: "exp2_b3", widget: "string" }
              - { label: "مورد ۴ سابقه ۲", name: "exp2_b4", widget: "string" }

              - { label: "عنوان سابقه ۳", name: "exp3_title", widget: "string" }
              - { label: "سازمان سابقه ۳", name: "exp3_org", widget: "string" }
              - { label: "تاریخ سابقه ۳", name: "exp3_date", widget: "string" }
              - { label: "مورد ۱ سابقه ۳", name: "exp3_b1", widget: "string" }
              - { label: "مورد ۲ سابقه ۳", name: "exp3_b2", widget: "string" }
              - { label: "مورد ۳ سابقه ۳", name: "exp3_b3", widget: "string" }
              - { label: "مورد ۴ سابقه ۳", name: "exp3_b4", widget: "string" }

              - { label: "عنوان سابقه ۴", name: "exp4_title", widget: "string" }
              - { label: "سازمان سابقه ۴", name: "exp4_org", widget: "string" }
              - { label: "تاریخ سابقه ۴", name: "exp4_date", widget: "string" }

              - { label: "عنوان سابقه ۵", name: "exp5_title", widget: "string" }
              - { label: "سازمان سابقه ۵", name: "exp5_org", widget: "string" }
              - { label: "تاریخ سابقه ۵", name: "exp5_date", widget: "string" }

              - { label: "عنوان سابقه ۶", name: "exp6_title", widget: "string" }
              - { label: "سازمان سابقه ۶", name: "exp6_org", widget: "string" }
              - { label: "تاریخ سابقه ۶", name: "exp6_date", widget: "string" }

              - { label: "تحصیلات ۱ (مقطع)", name: "edu1_degree", widget: "string" }
              - { label: "تحصیلات ۱ (دانشگاه)", name: "edu1_uni", widget: "string" }
              - { label: "تحصیلات ۱ (توضیحات)", name: "edu1_desc", widget: "text" }

              - { label: "تحصیلات ۲ (مقطع)", name: "edu2_degree", widget: "string" }
              - { label: "تحصیلات ۲ (دانشگاه)", name: "edu2_uni", widget: "string" }
              - { label: "تحصیلات ۲ (توضیحات)", name: "edu2_desc", widget: "text" }

              - { label: "فوق برنامه ۱", name: "extra1_title", widget: "string" }
              - { label: "توضیح فوق برنامه ۱", name: "extra1_desc", widget: "text" }
              - { label: "فوق برنامه ۲", name: "extra2_title", widget: "string" }
              - { label: "توضیح فوق برنامه ۲", name: "extra2_desc", widget: "text" }
              - { label: "فوق برنامه ۳", name: "extra3_title", widget: "string" }
              - { label: "توضیح فوق برنامه ۳", name: "extra3_desc", widget: "text" }

      - name: "content_en"
        label: "ویرایش نسخه انگلیسی (EN)"
        file: "content.json"
        format: "json"
        fields:
          - label: "بخش انگلیسی"
            name: "en"
            widget: "object"
            fields:
              - { label: "Name", name: "header_name", widget: "string" }
              - { label: "Status", name: "status", widget: "string" }
              - { label: "Hero Role", name: "hero_role", widget: "string" }
              - { label: "Hero Desc", name: "hero_desc", widget: "text" }
