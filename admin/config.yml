backend:
  name: github
  repo: rabbani-esmaeil/portfolio-
  branch: main

media_folder: "/"
public_folder: "/"

collections:
  - name: "content"
    label: "مدیریت محتوای پورتفولیو"
    files:
      - name: "portfolio_fa"
        label: "ویرایش اطلاعات رزومه (فارسی)"
        file: "content.json"
        format: "json"
        fields:
          - label: "محتوای سایت"
            name: "fa"
            widget: "object"
            fields:
              - { label: "نام و نام خانوادگی", name: "header_name", widget: "string" }
              - { label: "عنوان شغلی اصلی", name: "hero_role", widget: "string" }
              - { label: "سمت فعلی", name: "status", widget: "string" }
              - { label: "متن معرفی و درباره من", name: "hero_desc", widget: "text" }
              
              - { label: "سابقه ۱ - عنوان سمت", name: "exp1_title", widget: "string" }
              - { label: "سابقه ۱ - نام سازمان", name: "exp1_org", widget: "string" }
