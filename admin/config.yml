backend:
  name: github
  repo: rabbani-esmaeil/portfolio-
  branch: main

media_folder: "/"
public_folder: "/"

collections:
  - name: "content"
    label: "مدیریت محتوای سایت"
    files:
      - name: "site_data"
        label: "اطلاعات رزومه و پورتفولیو"
        file: "content.json"
        format: "json"
        fields:
          - { label: "نام و نام خانوادگی", name: "name", widget: "string" }
          - { label: "عنوان شغلی", name: "title", widget: "string" }
          - { label: "درباره من", name: "about", widget: "text" }
          - { label: "عکس پروفایل", name: "avatar", widget: "image", required: false }
          - label: "سوابق کاری"
            name: "experiences"
            widget: "list"
            fields:
              - { label: "سمت", name: "role", widget: "string" }
              - { label: "شرکت / سازمان", name: "company", widget: "string" }
              - { label: "دوره زمانی", name: "period", widget: "string" }
              - { label: "توضیحات", name: "desc", widget: "text" }
          - label: "تحصیلات"
            name: "education"
            widget: "list"
            fields:
              - { label: "مقطع و رشته", name: "degree", widget: "string" }
              - { label: "دانشگاه", name: "school", widget: "string" }
              - { label: "سال", name: "year", widget: "string" }
          - label: "مهارت‌ها"
            name: "skills"
            widget: "list"
            field: { label: "مهارت", name: "skill", widget: "string" }
          - label: "اطلاعات تماس"
            name: "contact"
            widget: "object"
            fields:
              - { label: "ایمیل", name: "email", widget: "string" }
              - { label: "شماره تماس", name: "phone", widget: "string" }
              - { label: "لینکدین", name: "linkedin", widget: "string", required: false }
              - { label: "گیت‌هاب", name: "github", widget: "string", required: false }
